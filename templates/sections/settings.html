<section id="section-settings" role="tabpanel" aria-labelledby="tab-settings" tabindex="0" class="tab-panel space-y-6 hidden">
    <div class="workspace-card rounded-2xl border border-slate-800 bg-slate-900 p-6 shadow-xl space-y-5">
        <div><p class="eyebrow">APP CONTROLS</p><h2 class="text-lg font-semibold text-emerald-500">Settings</h2><p class="text-sm text-slate-400">Manage profiles, appearance, installation, recovery, and account actions.</p></div>
        <div class="grid gap-4 sm:grid-cols-2">
            <div class="rounded-xl border border-slate-800 bg-slate-950 p-4 space-y-3"><h3 class="font-semibold">Profiles</h3><form method="POST" action="{{ url_for('main.switch_profile') }}" class="flex gap-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="sr-only" for="settings-profile-select">Active profile</label><select id="settings-profile-select" name="profile_id" class="form-control">{% for profile in profiles %}<option value="{{ profile.id }}" {% if profile.id == active_profile_id %}selected{% endif %}>{{ profile.name }}</option>{% endfor %}</select><button class="rounded-lg bg-emerald-700 px-3" type="submit">Switch</button></form><form method="POST" action="{{ url_for('main.create_profile') }}" class="flex gap-2"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label class="sr-only" for="settings-new-profile-name">New profile name</label><input id="settings-new-profile-name" name="name" class="form-control" placeholder="New profile" maxlength="60"><button class="rounded-lg border border-slate-700 px-3" type="submit">Add</button></form></div>
            <div class="rounded-xl border border-slate-800 bg-slate-950 p-4 space-y-3"><h3 class="font-semibold">Appearance</h3><div class="flex flex-wrap items-center gap-3"><label class="accent-picker" title="Change site accent color"><span>Accent</span><input type="color" id="settings-accent-color" aria-label="Main accent color" value="#10b981" onchange="setAccentColor(this.value)"></label><button type="button" onclick="resetAccentColor()" class="rounded-lg border border-slate-700 px-2 py-1.5 text-xs">Reset</button><button type="button" onclick="toggleDarkMode()" class="rounded-lg border border-slate-700 px-3 py-1.5 text-sm"><span id="theme-label">Toggle theme</span></button></div></div>
            <div class="rounded-xl border border-slate-800 bg-slate-950 p-4 space-y-3"><h3 class="font-semibold">Tools</h3><div class="flex flex-wrap gap-3"><a href="{{ url_for('main.diagnostics') }}" class="underline text-sm">Diagnostics</a><button id="install-app-settings" type="button" class="hidden rounded-lg bg-emerald-700 px-3 py-1.5 text-sm">Install app</button></div></div>
            {% if auth_enabled %}<div class="rounded-xl border border-slate-800 bg-slate-950 p-4"><h3 class="font-semibold mb-3">Account</h3><form method="POST" action="{{ url_for('logout') }}" onsubmit="return prepareSignOut(event)"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button type="submit" class="underline text-sm">Sign out</button></form></div>{% endif %}
        </div>
    </div>
</section>
