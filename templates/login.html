<!doctype html>
<html lang="en" class="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · IronTrack</title><link rel="stylesheet" href="{{ url_for('static', filename='tailwind.css') }}"><link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}"></head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-6"><main class="max-w-md mx-auto space-y-4"><h1 class="text-2xl font-semibold">Sign in to IronTrack</h1>
<p class="text-slate-400">Your personal workout journal.</p>
{% if error %}<p role="alert" class="text-rose-400">{{ error }}</p>{% endif %}
<form method="post" class="space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label class="field-label">Username<input name="username" autocomplete="username" maxlength="100" required class="form-control"></label>
<label class="field-label">Password<input type="password" name="password" autocomplete="current-password" maxlength="1024" required class="form-control"></label>
<button class="bg-emerald-600 rounded-lg px-4 py-3" type="submit">Sign in</button></form></main></body></html>
