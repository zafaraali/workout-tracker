services:
  irontrack:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:?Run configure_access.py first}
      IRONTRACK_USERNAME: ${IRONTRACK_USERNAME:-owner}
      IRONTRACK_PASSWORD_HASH: ${IRONTRACK_PASSWORD_HASH:?Run configure_access.py first}
      FLASK_COOKIE_SECURE: ${FLASK_COOKIE_SECURE:-0}
    volumes:
      - irontrack-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  irontrack-data:
